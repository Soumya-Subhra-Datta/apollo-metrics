<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Metrics - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="/static/background.mp4" type="video/mp4">
    </video>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>Apollo Metrics</h1>
                <p>AI-Powered Data Analytics Platform</p>
            </div>
            <h2>Create Account</h2>
            <div id="error-message"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <div class="auth-link">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
