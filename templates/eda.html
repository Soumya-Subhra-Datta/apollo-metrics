<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto EDA - Apollo Metrics</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Apollo Metrics</h2>
                <p>Data Analytics Platform</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
                <a href="/upload" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Dataset</a>
                <a href="/eda" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Auto EDA</a>
                <a href="/charts" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Charts</a>
                <a href="/ml" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>ML Models</a>
                <a href="/query" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Ask AI</a>
                <a href="/reports" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Reports</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="sidebar-avatar">U</div>
                    <div class="user-details">
                        <div class="name" id="sidebar-name">User</div>
                        <div class="email" id="sidebar-email">user@email.com</div>
                    </div>
                </div>
                <button class="btn btn-outline btn-sm" style="width:100%;" onclick="logout()">Sign Out</button>
            </div>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
                    <h1>Automated EDA</h1>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-label">Dark</span></button>
                </div>
            </header>
            <div class="content-area">
                <div class="section">
                    <div class="card">
                        <div class="card-header">
                            <h3>Select Dataset</h3>
                        </div>
                        <div class="flex items-center gap-2" style="flex-wrap:wrap;">
                            <select id="dataset-select" style="flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:14px;">
                                <option value="">-- Select a dataset --</option>
                            </select>
                            <button class="btn btn-primary" onclick="runEDA()">Run EDA</button>
                        </div>
                    </div>
                </div>
                <div id="eda-results" class="hidden">
                    <div class="stats-grid" id="eda-overview"></div>
                    <div class="grid-2">
                        <div class="card"><div class="card-header"><h3>Numerical Statistics</h3></div><div id="numerical-stats"></div></div>
                        <div class="card"><div class="card-header"><h3>Categorical Statistics</h3></div><div id="categorical-stats"></div></div>
                    </div>
                    <div class="card"><div class="card-header"><h3>EDA Insights</h3></div><div id="eda-insights"></div></div>
                    <div class="card"><div class="card-header"><h3>Correlation Matrix</h3></div><div id="correlation-matrix"></div></div>
                    <div class="card"><div class="card-header"><h3>Dataset Preview</h3></div><div class="table-container" id="eda-preview"></div></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/eda.js"></script>
</body>
</html>
